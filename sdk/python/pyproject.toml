[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "isb"
version = "0.1.1"
description = "Python SDK for isb: declarative incus sandboxes (containers and VMs)"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Stephan Fitzpatrick", email = "stephan@orangecountyai.com" }]
keywords = ["incus", "sandbox", "containers", "virtual-machines", "lxc"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
    "Topic :: System :: Systems Administration",
    "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/execution-associates/isb"
Repository = "https://github.com/execution-associates/isb"
Documentation = "https://github.com/execution-associates/isb/tree/main/sdk/python"

[dependency-groups]
dev = ["ruff>=0.6", "mypy>=1.11"]

[tool.hatch.build.targets.wheel]
packages = ["src/isb"]
exclude = ["src/isb/_bin"]

[tool.hatch.build.targets.wheel.hooks.custom]
path = "hatch_build.py"

[tool.hatch.build.targets.sdist]
include = ["src/isb", "tests", "scripts", "hatch_build.py", "README.md", "LICENSE"]
exclude = ["src/isb/_bin"]

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["src/isb/_spec.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "A", "BLE", "RUF"]
# typing.Dict/List/Optional keep the annotations readable on 3.10 and match
# the generated _spec.py.
ignore = ["UP006", "UP007", "UP035", "UP045", "UP037", "RUF022"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src/isb", "tests", "scripts"]
