# A virtual machine sandbox.
#
#   isb -f examples/vm.yaml up -d       # boots the VM, waits for its agent, returns
#   isb -f examples/vm.yaml exec worker -- uname -a
#   isb -f examples/vm.yaml down --volumes
#
# `type: vm` is the only thing that makes this a VM instead of a container.
# What changes with it:
#   - the image must be a VM image (`images:<distro>/<release>/cloud` from the
#     linuxcontainers remote, or a local VM image: VM_IMAGE=my-image)
#   - it boots its own kernel: tens of seconds instead of one or two, and the
#     first boot of a cloud image usually reboots once (isb waits it out)
#   - `exec` goes through the incus agent in the guest, hence `agent` in ready
#   - host folders are shared over virtiofs: edits made on the host do not
#     reach inotify watchers in the VM, so watchers there need polling
#   - `privileged` and `idmap` are container-only and refused here

name: vm-example

volumes:
  worker-data: {}

services:
  worker:
    type: vm
    image: "${VM_IMAGE:-images:debian/13/cloud}"
    cpus: 2
    mem_limit: 2g
    labels:
      example: vm
    volumes:
      # A host folder, read-only in the guest.
      - "${SRC:-.}:/srv/src:ro"
      # A named volume (vm-example_worker-data) that outlives the VM.
      - worker-data:/var/lib/worker
    raw_devices:
      # Grow the root disk (the image default is small).
      root: { size: 20GiB }
    ready: [running, agent, default_route]
    ready_timeout: 5m

    # Publishing a VM port on the host. incus proxies into a VM only in NAT
    # mode (isb sets nat: "true"), and `bind: guest` is not available for VMs.
    # The guest side defaults to 0.0.0.0, so incus (7.0.1+) finds the VM's
    # address itself. Publish on a specific host address you mean to expose (a
    # tailnet IP, say), never 0.0.0.0: NAT forwarding is DNAT and does not pass
    # through a host firewall like ufw. Host 127.0.0.1 does not work as a NAT
    # listen address.
    #
    # ports:
    #   - "${PUBLISH_IP}:8080:80"
