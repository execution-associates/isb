id: uptime-kuma
name: Uptime Kuma
description: A self-hosted monitoring tool with HTTP, TCP, DNS and ping checks, status pages and notifications.
version: "1"
tags: [monitoring, status-page]
links:
  website: https://uptime.kuma.pet
  source: https://github.com/louislam/uptime-kuma
variables:
  - name: domain
    type: domain
    label: Domain
    description: The public hostname; empty for a generated one.
apps:
  - name: kuma
    image: docker:louislam/uptime-kuma:1
    port: 3001
    volumes: ["data:/app/data"]
    domains:
      - {host: "${domain}"}
notes:
  - The first visit asks for an admin account; open the URL right away.
