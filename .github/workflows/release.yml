name: Release

# Publishes a v* tag: the static (musl) Linux and macOS tarballs that
# release-binaries.yml built on main for the tag's commit, with SHA256SUMS,
# and install.sh, the installer (`curl -fsSL .../releases/latest/download/install.sh | sh`),
# so hosts never build isb themselves.
# The tag promotes main's work rather than redoing it. The gate job refuses a
# tag whose commit has not passed main's CI (ci.yml on the push to main), then
# looks up release-binaries.yml's successful push-to-main run for the commit,
# and the release job downloads that run's artifacts. When there is no such
# run (it failed, or its artifacts expired after 30 days), the build job calls
# release-binaries.yml here instead, so a release is never blocked on it.
# SHA256SUMS is signed (SHA256SUMS.sig, raw Ed25519) with the secret
# ISB_RELEASE_SIGNING_KEY, whose public key isb compiles in (RELEASE_KEYS in
# crates/isb-core/src/self_update.rs): `isb update`, `isb machine init` and
# server upgrades install nothing whose signature does not verify. Each
# tarball also gets a GitHub build attestation (`gh attestation verify`).
# install.sh checks the same signature before it installs anything; the
# install job then runs the published installer on Linux and macOS.
# The crates go to crates.io from crates.yml, not from here: crates.io limits
# how many versions a day it takes, and a release never waits on that.
# Run it by hand (workflow_dispatch) on a branch to
# build the artifacts without releasing. Tag only after main's CI is green.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  gate:
    name: main CI passed
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    outputs:
      build_run: ${{ steps.binaries.outputs.run }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            Cargo.toml
            scripts/main-run.sh
          sparse-checkout-cone-mode: false
      - name: tag matches Cargo.toml version
        run: |
          want="v$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)"
          [ "$GITHUB_REF_NAME" = "$want" ] || { echo "tag $GITHUB_REF_NAME != Cargo.toml $want"; exit 1; }
      - name: CI passed on main for this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/main-run.sh ci.yml "$GITHUB_SHA"
      - name: main's release binaries for this commit
        id: binaries
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if run=$(scripts/main-run.sh release-binaries.yml "$GITHUB_SHA" --optional); then
            echo "run=$run" >> "$GITHUB_OUTPUT"
          else
            rc=$?
            [ "$rc" = 3 ] || exit "$rc"
            echo "no release binaries on main for $GITHUB_SHA: building them in this run"
          fi

  # Only when main has no binaries for the commit, and on workflow_dispatch.
  build:
    needs: gate
    if: ${{ !cancelled() && needs.gate.result != 'failure' && needs.gate.outputs.build_run == '' }}
    permissions:
      contents: read
    uses: ./.github/workflows/release-binaries.yml

  release:
    name: publish release
    needs: [gate, build]
    if: >-
      ${{ !cancelled() && startsWith(github.ref, 'refs/tags/v')
      && needs.gate.result == 'success'
      && (needs.build.result == 'success'
      || (needs.build.result == 'skipped' && needs.gate.outputs.build_run != '')) }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            crates/isb-core/src/self_update.rs
            install.sh
          sparse-checkout-cone-mode: false
      - name: main's binaries for this commit
        if: needs.gate.outputs.build_run != ''
        uses: actions/download-artifact@v4
        with:
          pattern: isb-*
          path: dist
          merge-multiple: true
          run-id: ${{ needs.gate.outputs.build_run }}
          github-token: ${{ github.token }}
      - name: the binaries built in this run
        if: needs.gate.outputs.build_run == ''
        uses: actions/download-artifact@v4
        with:
          pattern: isb-*
          path: dist
          merge-multiple: true
      # Exactly the four tarballs install.sh asks for, named by the tag, and
      # the one this runner can execute reports the tag's version.
      - name: the tarballs are this version's
        run: |
          v="${GITHUB_REF_NAME#v}"
          ls -l dist
          set -- dist/*.tar.gz
          [ $# = 4 ] || { echo "want exactly 4 tarballs, got $#"; exit 1; }
          for t in x86_64-unknown-linux-musl aarch64-unknown-linux-musl aarch64-apple-darwin x86_64-apple-darwin; do
            [ -f "dist/isb-v$v-$t.tar.gz" ] || { echo "missing isb-v$v-$t.tar.gz"; exit 1; }
          done
          tar -xzf "dist/isb-v$v-x86_64-unknown-linux-musl.tar.gz" -C "$RUNNER_TEMP"
          got=$("$RUNNER_TEMP/isb-v$v-x86_64-unknown-linux-musl/isb" --version)
          [ "$got" = "isb $v" ] || { echo "binary reports $got, want isb $v"; exit 1; }
      - run: cp install.sh dist/ && cd dist && sha256sum -- *.tar.gz install.sh > SHA256SUMS && cat SHA256SUMS
      # Refuse to publish a release this version's isb could not verify: the
      # secret's public key must be one of the keys compiled in.
      - name: sign SHA256SUMS
        env:
          KEY: ${{ secrets.ISB_RELEASE_SIGNING_KEY }}
        run: |
          [ -n "$KEY" ] || { echo "secret ISB_RELEASE_SIGNING_KEY is not set"; exit 1; }
          umask 077
          key="$RUNNER_TEMP/release-key.pem"
          printf '%s\n' "$KEY" > "$key"
          pub=$(openssl pkey -in "$key" -pubout -outform DER | tail -c 32 | od -An -tx1 | tr -d ' \n')
          echo "release key $pub"
          grep -q "\"$pub\"" crates/isb-core/src/self_update.rs \
            || { echo "release key $pub is not in RELEASE_KEYS"; rm -f "$key"; exit 1; }
          openssl pkeyutl -sign -rawin -inkey "$key" -in dist/SHA256SUMS -out dist/SHA256SUMS.sig
          openssl pkey -in "$key" -pubout -out "$RUNNER_TEMP/release-key.pub"
          rm -f "$key"
          openssl pkeyutl -verify -rawin -pubin -inkey "$RUNNER_TEMP/release-key.pub" \
            -in dist/SHA256SUMS -sigfile dist/SHA256SUMS.sig
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/*.tar.gz
      - name: create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.tar.gz dist/install.sh dist/SHA256SUMS dist/SHA256SUMS.sig \
            --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes

  # The installer as users run it, from the release just published.
  install:
    name: install.sh on ${{ matrix.runner }}
    needs: release
    # A job skipped upstream (the rebuild or `check` a tag skips) fails an
    # implicit success(), so this names the result it depends on.
    if: ${{ !cancelled() && needs.release.result == 'success' }}
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        runner: [ubuntu-24.04, macos-15]
    steps:
      - name: install with the published install.sh
        run: |
          v="${GITHUB_REF_NAME#v}"
          curl -fsSL "https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME/install.sh" -o install.sh
          ISB_INSTALL_DIR="$RUNNER_TEMP/bin" sh install.sh "$v"
          [ "$("$RUNNER_TEMP/bin/isb" --version)" = "isb $v" ]
