name: Release

# Static (musl) Linux binaries for x86_64 and aarch64, and macOS binaries for
# both (linked only against the system libraries), published as release
# assets with SHA256SUMS when a v* tag is pushed, together with install.sh,
# the installer (`curl -fsSL .../releases/latest/download/install.sh | sh`),
# so hosts never build isb themselves.
# SHA256SUMS is signed (SHA256SUMS.sig, raw Ed25519) with the secret
# ISB_RELEASE_SIGNING_KEY, whose public key isb compiles in (RELEASE_KEYS in
# crates/isb-core/src/self_update.rs): `isb update`, `isb machine init` and
# server upgrades install nothing whose signature does not verify. Each
# tarball also gets a GitHub build attestation (`gh attestation verify`).
# install.sh checks the same signature before it installs anything; the
# install job then runs the published installer on Linux and macOS.
# After the release, the seven crates go to crates.io (secret
# CARGO_REGISTRY_TOKEN); a crate version that is already there is skipped, so a
# failed run can be re-run. Run it by hand (workflow_dispatch) to build the
# artifacts without releasing. Tag only after main's CI is green.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-24.04
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
          - target: aarch64-apple-darwin
            runner: macos-15
          - target: x86_64-apple-darwin
            runner: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - name: tag matches Cargo.toml version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          want="v$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)"
          [ "$GITHUB_REF_NAME" = "$want" ] || { echo "tag $GITHUB_REF_NAME != Cargo.toml $want"; exit 1; }
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      # The web UI is embedded at build time (build.rs); ISB_WEB_REQUIRED
      # makes a missing web/dist a build error, so a release never ships
      # the placeholder page.
      - uses: oven-sh/setup-bun@v2
      - name: build the web UI
        working-directory: web
        run: bun install --frozen-lockfile && bun run build
      - run: cargo build --release --locked --target ${{ matrix.target }}
        env:
          ISB_WEB_REQUIRED: "1"
      - name: check the binary is static and runs
        if: runner.os == 'Linux'
        run: |
          bin=target/${{ matrix.target }}/release/isb
          file "$bin"
          file "$bin" | grep -qE 'statically linked|static-pie linked'
          "$bin" --version
      # macOS has no static linking: allow only the system libraries.
      - name: check the binary links only system libraries and runs
        if: runner.os == 'macOS'
        run: |
          bin=target/${{ matrix.target }}/release/isb
          file "$bin"
          otool -L "$bin"
          if otool -L "$bin" | tail -n +2 | grep -vE '^\s+/(usr/lib|System/Library)/'; then
            echo "links a non-system library"; exit 1
          fi
          "$bin" --version
      - name: package
        run: |
          name="isb-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir -p "dist/$name"
          cp target/${{ matrix.target }}/release/isb LICENSE README.md "dist/$name/"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/*.tar.gz
          if-no-files-found: error

  release:
    name: publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            crates/isb-core/src/self_update.rs
            install.sh
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - run: cp install.sh dist/ && cd dist && sha256sum *.tar.gz install.sh > SHA256SUMS && cat SHA256SUMS
      # Refuse to publish a release this version's isb could not verify: the
      # secret's public key must be one of the keys compiled in.
      - name: sign SHA256SUMS
        env:
          KEY: ${{ secrets.ISB_RELEASE_SIGNING_KEY }}
        run: |
          [ -n "$KEY" ] || { echo "secret ISB_RELEASE_SIGNING_KEY is not set"; exit 1; }
          umask 077
          key="$RUNNER_TEMP/release-key.pem"
          printf '%s\n' "$KEY" > "$key"
          pub=$(openssl pkey -in "$key" -pubout -outform DER | tail -c 32 | od -An -tx1 | tr -d ' \n')
          echo "release key $pub"
          grep -q "\"$pub\"" crates/isb-core/src/self_update.rs \
            || { echo "release key $pub is not in RELEASE_KEYS"; rm -f "$key"; exit 1; }
          openssl pkeyutl -sign -rawin -inkey "$key" -in dist/SHA256SUMS -out dist/SHA256SUMS.sig
          openssl pkey -in "$key" -pubout -out "$RUNNER_TEMP/release-key.pub"
          rm -f "$key"
          openssl pkeyutl -verify -rawin -pubin -inkey "$RUNNER_TEMP/release-key.pub" \
            -in dist/SHA256SUMS -sigfile dist/SHA256SUMS.sig
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/*.tar.gz
      - name: create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.tar.gz dist/install.sh dist/SHA256SUMS dist/SHA256SUMS.sig \
            --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes

  # The installer as users run it, from the release just published.
  install:
    name: install.sh on ${{ matrix.runner }}
    if: startsWith(github.ref, 'refs/tags/v')
    needs: release
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        runner: [ubuntu-24.04, macos-15]
    steps:
      - name: install with the published install.sh
        run: |
          v="${GITHUB_REF_NAME#v}"
          curl -fsSL "https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME/install.sh" -o install.sh
          ISB_INSTALL_DIR="$RUNNER_TEMP/bin" sh install.sh "$v"
          [ "$("$RUNNER_TEMP/bin/isb" --version)" = "isb $v" ]

  crates:
    name: publish to crates.io
    if: startsWith(github.ref, 'refs/tags/v')
    needs: release
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # Dependency order: everything needs isb-core; isb-daemon needs the
      # others; isb needs them all.
      - name: publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          [ -n "$CARGO_REGISTRY_TOKEN" ] || { echo "secret CARGO_REGISTRY_TOKEN is not set"; exit 1; }
          v="${GITHUB_REF_NAME#v}"
          for c in isb-core isb-egress isb-apps isb-server isb-tui isb-daemon isb; do
            code=$(curl -s -o /dev/null -w '%{http_code}' -A "isb-release (github.com/$GITHUB_REPOSITORY)" \
              "https://crates.io/api/v1/crates/$c/$v")
            if [ "$code" = 200 ]; then echo "$c $v is already on crates.io"; continue; fi
            cargo publish --locked -p "$c"
          done
