name: SDK (TypeScript)

# The TypeScript SDK in sdk/typescript: typecheck, lint and unit tests against
# a cargo-built isb on every PR and push to main. On v* tags, also build the
# npm packages (the SDK and the two platform packages carrying the tag's signed
# release binary, fetched and verified by scripts/release-binary.sh once
# release.yml has published it), upload the packed tarballs as artifacts, then
# publish them to npm by trusted publishing, which records provenance (a
# package version already on npm is skipped, so a failed run can be re-run).
# A tag push promotes what main checked: the gate refuses a commit that has
# not passed main's CI, and skips `check` when this workflow already passed
# on main for the commit. A workflow_dispatch with `tag` runs `check` first.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      tag:
        description: "Build and publish this existing v* tag (re-publish a release)"
        required: false
        default: ""

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

defaults:
  run:
    working-directory: sdk/typescript

jobs:
  gate:
    name: main CI passed
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      passed: ${{ steps.self.outputs.passed }}
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts/main-run.sh
          sparse-checkout-cone-mode: false
      - name: CI passed on main for this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/main-run.sh ci.yml "$GITHUB_SHA"
      - name: this workflow passed on main for this commit
        id: self
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if scripts/main-run.sh sdk-typescript.yml "$GITHUB_SHA" --optional >/dev/null; then
            echo "passed=true" >> "$GITHUB_OUTPUT"
          else
            rc=$?
            [ "$rc" = 3 ] || exit "$rc"
          fi

  check:
    name: typecheck, lint, unit tests
    needs: gate
    if: ${{ !cancelled() && needs.gate.result != 'failure' && needs.gate.outputs.passed != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: build isb
        working-directory: .
        run: cargo build --locked
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run lint
      # Integration tests need incusd and skip themselves without ISB_INTEGRATION=1.
      - run: bun test
        env:
          ISB_BIN: ${{ github.workspace }}/target/debug/isb
      - name: build and pack (dry run)
        run: bun run build && bun pm pack --dry-run

  binaries:
    name: isb ${{ matrix.target }}
    needs: [gate, check]
    if: >-
      ${{ !cancelled() && (startsWith(github.ref, 'refs/tags/v') || inputs.tag != '')
      && needs.gate.result != 'failure'
      && (needs.check.result == 'success'
      || (needs.check.result == 'skipped' && needs.gate.outputs.passed == 'true')) }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-24.04
            npm: linux-x64
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
            npm: linux-arm64
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - name: tag matches Cargo.toml and package.json versions
        working-directory: .
        run: |
          want="v$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)"
          tag="${{ inputs.tag || github.ref_name }}"
          [ "$tag" = "$want" ] || { echo "tag $tag != Cargo.toml $want"; exit 1; }
          for p in sdk/typescript/package.json sdk/typescript/npm/*/package.json; do
            v="v$(grep -m1 '"version"' "$p" | cut -d'"' -f4)"
            [ "$v" = "$want" ] || { echo "$p is $v, want $want"; exit 1; }
          done
      - name: the signed release binary is static and runs
        working-directory: .
        run: |
          scripts/release-binary.sh "${{ inputs.tag || github.ref_name }}" "$RUNNER_TEMP/isb"
          bin=$RUNNER_TEMP/isb/isb
          file "$bin"
          file "$bin" | grep -qE 'statically linked|static-pie linked'
          "$bin" --version
          "$bin" rpc </dev/null | grep -q '"protocol":1'
      - uses: oven-sh/setup-bun@v2
      - name: pack the platform package
        run: |
          dir=npm/${{ matrix.npm }}
          install -m 0755 "$RUNNER_TEMP/isb/isb" "$dir/bin/isb"
          cp LICENSE "$dir/"
          mkdir -p "$RUNNER_TEMP/npm"
          (cd "$dir" && bun pm pack --destination "$RUNNER_TEMP/npm")
          tar -tvzf "$RUNNER_TEMP"/npm/*.tgz
      - uses: actions/upload-artifact@v4
        with:
          name: npm-${{ matrix.npm }}
          path: ${{ runner.temp }}/npm/*.tgz
          if-no-files-found: error

  sdk-package:
    name: pack @execution-associates/isb
    needs: [gate, check]
    if: >-
      ${{ !cancelled() && (startsWith(github.ref, 'refs/tags/v') || inputs.tag != '')
      && needs.gate.result != 'failure'
      && (needs.check.result == 'success'
      || (needs.check.result == 'skipped' && needs.gate.outputs.passed == 'true')) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: pack
        run: |
          mkdir -p "$RUNNER_TEMP/npm"
          bun pm pack --destination "$RUNNER_TEMP/npm"
          tar -tzf "$RUNNER_TEMP"/npm/*.tgz
      - uses: actions/upload-artifact@v4
        with:
          name: npm-sdk
          path: ${{ runner.temp }}/npm/*.tgz
          if-no-files-found: error

  publish:
    name: publish to npm
    if: startsWith(github.ref, 'refs/tags/v') || inputs.tag != ''
    needs: [binaries, sdk-package]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: npm-*
          path: npm
          merge-multiple: true
      # Trusted publishing needs npm 11.5.1 or later and no registry token.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: publish
        run: |
          npm --version
          ls -l npm
          # The platform packages first: the SDK depends on them.
          for t in npm/*isb-linux-*.tgz npm/*isb-[0-9]*.tgz; do
            [ -f "$t" ] || { echo "missing $t"; exit 1; }
            name=$(tar -xzOf "$t" package/package.json | node -p 'JSON.parse(require("fs").readFileSync(0)).name')
            ver=$(tar -xzOf "$t" package/package.json | node -p 'JSON.parse(require("fs").readFileSync(0)).version')
            if npm view "$name@$ver" version >/dev/null 2>&1; then echo "$name@$ver is already on npm"; continue; fi
            npm publish "./$t" --access public
          done
