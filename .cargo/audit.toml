# cargo-audit (CI's rustsec/audit-check) does not read deny.toml; keep this
# list in step with its [advisories] ignore, which has the reasoning.
[advisories]
ignore = [
    "RUSTSEC-2023-0071", # rsa via age's ssh feature: isb never decrypts or signs with RSA keys
    "RUSTSEC-2026-0009", # time via rcgen: the fix needs a newer Rust than the 1.87 MSRV; isb never parses RFC 2822 with it
    "RUSTSEC-2026-0387", # crypto-bigint 0.5 via age's p256: isb uses no P-256 age recipients or keys; no age release has the fix
]
