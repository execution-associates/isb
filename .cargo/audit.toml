# cargo-audit (CI's rustsec/audit-check) does not read deny.toml; keep this
# list in step with its [advisories] ignore, which has the reasoning.
[advisories]
ignore = [
    "RUSTSEC-2023-0071", # rsa via age's ssh feature: isb never decrypts or signs with RSA keys
    "RUSTSEC-2026-0009", # time via rcgen: the fix needs a newer Rust than the 1.85 MSRV; isb never parses RFC 2822 with it
]
